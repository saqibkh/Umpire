on:
  push:
    branches:
      - develop
      - main
      - v*
  pull_request:
name: Simulated GPU
permissions:
  contents: read
jobs:
  cuda_tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: pantheongpu/setup-pantheonsim@23932d9b811269d55c8d65687332fefc65daeb2c # v0.1.3
      with:
        gpu: nvidia/t4
        count: 4
        cuda-toolkit: '12.8'
    - name: Build
      run: |
        cmake -S . -B build -DUMPIRE_ENABLE_DEVELOPER_DEFAULTS=On -DCMAKE_CXX_COMPILER=g++ -DENABLE_CUDA=On -DCMAKE_CUDA_COMPILER=nvcc -DCMAKE_CUDA_ARCHITECTURES=75 -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared -DCUDA_USE_STATIC_CUDA_RUNTIME=Off
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build -T test --output-on-failure --timeout 600 -E resource_aware_pool_tests
